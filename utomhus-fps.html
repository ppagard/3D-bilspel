<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Utomhus FPS</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#83cdf5}.hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;display:flex;gap:7px;flex-wrap:wrap;font-weight:800;font-size:13px;pointer-events:none}.hud span{padding:7px 9px;border-radius:12px;background:#0009;backdrop-filter:blur(5px)}#aim{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}#aim:before,#aim:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}#aim:before{left:11px;width:2px;height:24px}#aim:after{top:11px;width:24px;height:2px}#cover{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(#5eb7e4,#d9f4ff 48%,#5e8c43 49%,#254a25)}.card{width:min(440px,94vw);padding:24px;border-radius:24px;text-align:center;background:#000b;box-shadow:0 15px 60px #0008}.card h1{margin:0 0 10px;font-size:34px}.card p{margin:8px 0;line-height:1.35}.card button{margin-top:15px;border:0;border-radius:999px;padding:14px 24px;font-size:18px;font-weight:900;background:#fff;color:#111}.small{font-size:13px;opacity:.75}#controls{position:fixed;inset:0;z-index:10;display:none;pointer-events:none}.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:1px solid #ffffff50;background:#0004;pointer-events:auto;touch-action:none}.pad.left{left:max(18px,env(safe-area-inset-left))}.pad.right{right:max(18px,env(safe-area-inset-right))}.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:#ffffff70;border:1px solid #fff8}#fire{position:absolute;right:max(32px,env(safe-area-inset-right));bottom:168px;width:76px;height:76px;border:1px solid #fff8;border-radius:50%;background:#d94343cc;color:#fff;font-weight:950;font-size:14px;pointer-events:auto;touch-action:none}#hurt{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,#f003);transition:opacity .08s}.rotate{display:none}@media(orientation:portrait) and (max-width:600px){.rotate{display:block;color:#ffe18a;font-weight:800}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="hurt"></div><div id="aim"></div>
<div class="hud"><span>❤️ <b id="hp">100</b></span><span>🔫 <b id="ammo">12</b></span><span>⭐ <b id="score">0</b></span><span>👾 <b id="left">0</b></span></div>
<div id="cover"><div class="card"><h1>Utomhus FPS</h1><p>Gå runt i skogen och skjut fienderna innan de når dig.</p><p>Vänster styrplatta går. Höger styrplatta tittar. Röd knapp skjuter.</p><p class="rotate">Vrid gärna telefonen till liggande läge.</p><button id="start">Starta spelet</button><p class="small">iPhone-optimerad version</p></div></div>
<div id="controls"><div class="pad left" id="move"><div class="knob"></div></div><div class="pad right" id="look"><div class="knob"></div></div><button id="fire">SKJUT</button></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),x=c.getContext('2d'),cover=document.querySelector('#cover'),controls=document.querySelector('#controls'),hpEl=document.querySelector('#hp'),ammoEl=document.querySelector('#ammo'),scoreEl=document.querySelector('#score'),leftEl=document.querySelector('#left'),hurt=document.querySelector('#hurt');
const M=["1111111111111111","1000000000000001","1000200000020001","1000001110000001","1000001000000001","1000001000000001","1000000000000001","1011000000001101","1000000000000001","1000000000000001","1000001000000001","1000001000000001","1000001110000001","1000200000020001","1000000000000001","1111111111111111"].map(r=>[...r].map(Number));
const FOV=Math.PI/3,PI2=Math.PI*2,MAX=18;let W=480,H=270,z=[],run=false,last=0,flash=0,wave=1,moveX=0,moveY=0,lookX=0;
const p={x:8,y:8,a:-Math.PI/2,hp:100,ammo:12,score:0,cool:0};let enemies=[];
function resize(){const ratio=innerHeight/innerWidth;W=Math.min(560,Math.max(360,innerWidth));H=Math.max(240,Math.round(W*ratio));c.width=W;c.height=H;z=new Array(W).fill(MAX)}addEventListener('resize',resize);resize();
const wall=(a,b)=>{const q=M[Math.floor(b)];return !q||q[Math.floor(a)]>0};const norm=a=>{while(a>Math.PI)a-=PI2;while(a<-Math.PI)a+=PI2;return a};const d=(a,b,q,r)=>Math.hypot(a-q,b-r);const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(){enemies=[];for(let i=0;i<4+wave*2;i++){let a,b,k=0;do{a=rnd(1.5,14.5);b=rnd(1.5,14.5);k++}while((wall(a,b)||d(a,b,p.x,p.y)<5)&&k<100);enemies.push({x:a,y:b,hp:45+wave*5,phase:rnd(0,PI2),hit:0})}hud()}
function reset(){p.x=8;p.y=8;p.a=-Math.PI/2;p.hp=100;p.ammo=12;p.score=0;p.cool=0;wave=1;spawn();run=true;last=performance.now();cover.style.display='none';controls.style.display='block';requestAnimationFrame(loop)}
function hud(){hpEl.textContent=Math.max(0,p.hp|0);ammoEl.textContent=p.ammo;scoreEl.textContent=p.score;leftEl.textContent=enemies.length}
function los(a,b,q,r){let n=Math.ceil(d(a,b,q,r)*12);for(let i=1;i<n;i++){let t=i/n;if(wall(a+(q-a)*t,b+(r-b)*t))return false}return true}
function shoot(){if(!run||p.cool>0)return;if(p.ammo<=0){p.ammo=12;hud();return}p.ammo--;p.cool=.18;flash=.07;let best=null,bd=99;for(const e of enemies){let dd=d(p.x,p.y,e.x,e.y),aa=Math.abs(norm(Math.atan2(e.y-p.y,e.x-p.x)-p.a));if(aa<Math.atan2(.35,dd)&&dd<bd&&los(p.x,p.y,e.x,e.y)){best=e;bd=dd}}if(best){best.hp-=34;best.hit=.15;if(best.hp<=0){enemies.splice(enemies.indexOf(best),1);p.score+=100;if(!enemies.length){wave++;p.hp=Math.min(100,p.hp+20);p.ammo=12;spawn()}}}hud()}
function update(dt){p.cool=Math.max(0,p.cool-dt);flash=Math.max(0,flash-dt);p.a=norm(p.a+lookX*dt*2.8);let f=-moveY,s=moveX,l=Math.hypot(f,s)||1;f/=l;s/=l;let ca=Math.cos(p.a),sa=Math.sin(p.a),nx=p.x+(ca*f-sa*s)*2.5*dt,ny=p.y+(sa*f+ca*s)*2.5*dt;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny;for(const e of enemies){e.phase+=dt*5;e.hit=Math.max(0,e.hit-dt);let dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy);if(dd>.7){let nx=e.x+dx/dd*(.5+wave*.03)*dt,ny=e.y+dy/dd*(.5+wave*.03)*dt;if(!wall(nx,e.y))e.x=nx;if(!wall(e.x,ny))e.y=ny}else if(e.hit<=0){e.hit=.65;p.hp-=8+wave;hurt.style.opacity='.8';setTimeout(()=>hurt.style.opacity='0',90);if(p.hp<=0){p.hp=0;run=false;controls.style.display='none';cover.style.display='grid';cover.querySelector('.card').innerHTML='<h1>Game over</h1><p>Poäng: <b>'+p.score+'</b></p><button id="again">Spela igen</button>';document.querySelector('#again').onclick=reset}hud()}}}
function ray(a){let ca=Math.cos(a),sa=Math.sin(a),t=0,typ=1;while(t<MAX){t+=.045;typ=M[Math.floor(p.y+sa*t)]?.[Math.floor(p.x+ca*t)]||0;if(typ)return[t,typ]}return[MAX,1]}
function bg(){let g=x.createLinearGradient(0,0,0,H/2);g.addColorStop(0,'#62b9eb');g.addColorStop(1,'#d9f6ff');x.fillStyle=g;x.fillRect(0,0,W,H/2);g=x.createLinearGradient(0,H/2,0,H);g.addColorStop(0,'#6c9c4d');g.addColorStop(1,'#234724');x.fillStyle=g;x.fillRect(0,H/2,W,H/2);x.fillStyle='#fff5a0';x.beginPath();x.arc(W*.82,H*.13,18,0,PI2);x.fill()}
function render(){bg();for(let sx=0;sx<W;sx+=2){let off=(sx/W-.5)*FOV,[dd,typ]=ray(p.a+off),cd=dd*Math.cos(off),hh=Math.min(H*1.4,H/Math.max(.01,cd)),top=H/2-hh/2,sh=Math.max(.15,1-cd/MAX),base=typ===2?[90,55,30]:[105,108,96];x.fillStyle=`rgb(${base[0]*sh|0},${base[1]*sh|0},${base[2]*sh|0})`;x.fillRect(sx,top,2,hh);z[sx]=z[sx+1]=cd}let list=enemies.map(e=>({e,dd:d(p.x,p.y,e.x,e.y)})).sort((a,b)=>b.dd-a.dd);for(const o of list){let e=o.e,ang=norm(Math.atan2(e.y-p.y,e.x-p.x)-p.a);if(Math.abs(ang)>FOV*.62)continue;let sx=(ang/FOV+.5)*W,hh=H/o.dd*.82,ww=hh*.55;if(z[Math.max(0,Math.min(W-1,sx|0))]<o.dd)continue;let yy=H/2+Math.sin(e.phase)*2;x.fillStyle=e.hit>0?'#ff8d66':'#8f2529';x.beginPath();x.arc(sx,yy-hh*.25,ww*.31,0,PI2);x.fill();x.fillStyle='#b63231';x.beginPath();x.ellipse(sx,yy+hh*.12,ww*.45,hh*.34,0,0,PI2);x.fill();x.fillStyle='#ffe76f';x.fillRect(sx-ww*.15,yy-hh*.31,ww*.08,ww*.08);x.fillRect(sx+ww*.07,yy-hh*.31,ww*.08,ww*.08)}x.fillStyle='#222';x.fillRect(W*.54,H*.78,W*.34,H*.15);x.fillStyle='#3c434d';x.fillRect(W*.64,H*.73,W*.25,H*.08);if(flash>0){x.fillStyle='#ffe77c';x.beginPath();x.moveTo(W*.88,H*.76);x.lineTo(W*.98,H*.71);x.lineTo(W*.94,H*.79);x.lineTo(W*.99,H*.84);x.closePath();x.fill()}}
function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}
function pad(id,cb){const el=document.querySelector(id),kn=el.querySelector('.knob');let pid=null;function set(e){const r=el.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;let dx=e.clientX-mx,dy=e.clientY-my,m=r.width*.34,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}kn.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;cb(dx/m,dy/m)}el.onpointerdown=e=>{pid=e.pointerId;el.setPointerCapture(pid);set(e)};el.onpointermove=e=>{if(e.pointerId===pid)set(e)};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId===pid){pid=null;kn.style.transform='translate(-50%,-50%)';cb(0,0)}}}
pad('#move',(a,b)=>{moveX=a;moveY=b});pad('#look',a=>lookX=a);document.querySelector('#fire').onpointerdown=e=>{e.preventDefault();shoot()};document.querySelector('#start').onclick=reset;document.querySelector('#start').ontouchend=e=>{e.preventDefault();reset()};bg();hud();
})();
</script>
</body></html>
